[package]
name = "gtw"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/prjctimg/gtw"
readme = "README.md"
description = "Wikipedia in your terminal: cached reading, rich rendering, inline media, and offline lists."

[[bin]]
name = "gtw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }
ratatui = { version = "0.30", features = ["crossterm", "all-widgets", "unstable-rendered-line-info", "underline-color"] }
tui-big-text = "0.8"
tachyonfx = "0.25"
dirs = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "gzip", "brotli", "stream", "charset"] }
scraper = "0.24"
html-escape = "0.2"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
zstd = "0.14"
sha2 = "0.10"
symphonia = { version = "0.5.5", features = ["all", "opt-simd"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-flac", "symphonia-mp3", "symphonia-ogg", "symphonia-vorbis", "symphonia-wav", "symphonia-pcm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tga", "ico", "tiff"] }
resvg = "0.49"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm", "image-defaults"] }
libc = "0.2"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2.3"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2"
zvidlib = { version = "0.5", default-features = false, features = ["vp8-decoder", "vp9-decoder", "opus-decoder", "vorbis-decoder"] }
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-parser = "0.1.15"
ratex-layout = "0.1.15"
ratex-types = "0.1.15"
pollster = "0.4"

[dev-dependencies]
base64 = "0.22"
tempfile = "3.14"

[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"

[profile.test]
debug = 0
strip = "debuginfo"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"
