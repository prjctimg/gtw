[package]
name = "gtw"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/prjctimg/gtw"
readme = "README.md"

[[bin]]
name = "gtw"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
tui-big-text = "0.8"
tachyonfx = "0.25"
dirs = "6.0"
keyring = { version = "3.6" }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "stream"] }
scraper = "0.24"
html5ever = "0.36"
rusqlite = { version = "0.37", features = ["bundled", "chrono"] }
zstd = "0.13"
symphonia = { version = "0.6", features = ["ogg", "mp3", "flac", "wav"] }
rodio = { version = "0.21", default-features = false, features = ["symphonia-all"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tga"] }
resvg = "0.45"
ratatui-image = "8.0"
async-trait = "0.1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
miette = { version = "7.6", features = ["fancy"] }
rusty_vp9 = "0.1"
matroska-demuxer = "0.7"
tempfile = "3.14"

[profile.release]
lto = "fat"
strip = "symbols"
codegen-units = 1
panic = "abort"

[profile.test]
debug = 0
strip = "debuginfo"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"
