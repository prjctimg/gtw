name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'
  VERGEN_GIT_SHA: ${{ github.sha }}
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: no-ffmpeg dependency gate
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE '^name = "(ffmpeg|ffmpeg-[^"]*|libav[^"]*)"' Cargo.lock; then
            echo "::error::FFmpeg is forbidden; use the pure-Rust zvidlib pipeline" >&2
            exit 1
          fi
          if cargo tree --workspace --all-features | grep -Ei '(^| )((ffmpeg|libav)[a-z0-9_-]*) v'; then
            echo "::error::FFmpeg is forbidden; use the pure-Rust zvidlib pipeline" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - run: cargo deny check
      - run: cargo build --workspace --release
