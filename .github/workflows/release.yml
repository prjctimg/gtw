name: Release

on:
  push:
    branches: ["dev"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - nightly
      version:
        description: "Release version (e.g. 0.1.0) for stable releases"
        required: false
        type: string

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'false'

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
      version: ${{ steps.set-tag.outputs.version }}
      nightly: ${{ steps.set-tag.outputs.nightly }}
      skip: ${{ steps.set-tag.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Derive tag
        id: set-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TYPE: ${{ github.event.inputs.release_type }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF: ${{ github.ref }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          manifest_version="$(grep -m1 '^version = ' Cargo.toml | sed 's/^version = "\(.*\)"/\1/')"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            if [[ "$INPUT_RELEASE_TYPE" == "nightly" ]]; then
              tag="nightly"
              version="${manifest_version}+${short_sha}+nightly"
              nightly="true"
            else
              version="$INPUT_VERSION"
              if [[ -z "$version" ]]; then echo "::error::version required" >&2; exit 1; fi
              tag="v${version}"
              nightly="false"
            fi
          elif [[ "$REF" == "refs/heads/dev" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            tag="nightly"
            version="${manifest_version}+${short_sha}+nightly"
            nightly="true"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            nightly="false"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "nightly=${nightly}" >> "$GITHUB_OUTPUT"
      - name: Move tag
        if: steps.set-tag.outputs.skip != 'true'
        run: |
          git config user.name "prjctimg"
          git config user.email "prjctimg@outlook.com"
          git tag -f "${{ steps.set-tag.outputs.tag }}"
          git push -f origin "${{ steps.set-tag.outputs.tag }}"

  build:
    needs: tag
    if: needs.tag.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config libssl-dev
      - name: Build
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.target }}/release/gtw artifacts/gtw-${{ matrix.platform }} || true
          cp target/${{ matrix.target }}/release/gtw artifacts/gtw 2>/dev/null || true
          chmod +x artifacts/* 2>/dev/null || true
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
