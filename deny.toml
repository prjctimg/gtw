# cargo-deny configuration for gtw.
# Run with: cargo deny check

[graph]
all-features = true

[advisories]
# syntect still uses the unmaintained yaml-rust 0.4 for loading Sublime grammar
# definitions. It is not reachable from untrusted input (grammars are compiled
# into the binary at build time), and syntect has no release using yaml-rust2
# yet. Remove this once syntect switches forks.
ignore = [
    { id = "RUSTSEC-2024-0320", reason = "syntect grammar loader; no user-controlled YAML and no fixed upstream release yet" },
    { id = "RUSTSEC-2025-0141", reason = "bincode is only used by syntect to load compiled syntax/theme dumps at build time" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash is an internal hash map in scraper/selectors; no upgrade path until scraper updates" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a build-time macro used by image/rav1e; no runtime exposure" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled by RaTeX for bundled KaTeX fonts; RaTeX has no release using skrifa yet" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CC-BY-4.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
    # gtw itself and dependencies that are copyleft-compatible.
    "AGPL-3.0-only",
    "GPL-2.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
]
confidence-threshold = 0.9
private = { ignore = false }

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
